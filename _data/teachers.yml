- name: Sarah Davis
  image: ../uploads/dsc07015.jpg
  certification: RYT-200
  instagram: https://www.instagram.com/theyogacowgirl
  bio: >-
    Sarah Davis began practicing yoga seven years ago after a painful back
    injury caused by poor body alignment. Certified in 2018, she started
    teaching at Belmont University in Nashville. Moving to Southcentral Kentucky
    in 2022 to be closer to her family and Tennessee Walking Horses, Sarah
    offers dynamic flow classes for all levels and ages. Her sessions emphasize
    breath, balance, body alignment, tension release, and fun, aiming to quiet
    the mind and calm the body. Outside of yoga, she enjoys trail riding, paddle
    boarding, hiking with her dogs, live music, and spending time at her family
    farm.
- name: Eleni Georgiadis
  image: ../uploads/dsc07026-1.jpg
  certification: CPT
  instagram: https://www.instagram.com/eleni.v.g
  bio: >-
    Eleni Georgiadis began teaching POP Pilates during the pandemic, channeling
    her enthusiasm for group fitness and movement. As a classically trained
    musician, she discovered a passion for teaching during the lockdown. Eleni's
    upbeat and engaging classes offer a full-body workout with a strong focus on
    mobility and core strength, welcoming all levels and building a community
    around fitness. Away from the mat, she enjoys gardening, hiking, and playing
    the French horn. Eleni and her husband are raising two dogs and a fresh baby
    in Glasgow, where they are proud to call home.
- name: Cheri Mahoney
  image: ../uploads/dsc07002.jpg
  certification: RYT-200, Chair Yoga
  instagram: cherilyn.mahoney
  bio: >-
    Cheri Mahoney is a cowgirl from Kansas who moved to Kentucky in 2023 after
    spending time out West. With a background in military service and
    engineering within the metal manufacturing industry, her path naturally led
    her to holistic movement as a means of relieving physical pain and restoring
    balance.

    Cheri’s teaching style is gentle and nurturing, creating a welcoming
    environment for all ages and abilities. She brings a grounded, compassionate
    presence to each session, helping others reconnect with their bodies through
    mindful movement.

    When she’s not guiding yoga classes, Cheri is often on the move — riding her
    road bike or answering the call of the wild on a new adventure.
- name: Madison Faulkner
  image: ../uploads/dsc07007.jpg
  certification: RYT-200
  instagram: ''
  bio: >-
    Madison Faulkner began practicing yoga in 2020, when the world paused and
    her collegiate athletic career abruptly came to an end. As one chapter
    closed, she found herself drawn to the mat — a space that became more than
    movement. It became refuge, healing, and a path back to herself.


    After moving back to the Glasgow area a few years later, Madison found Asha
    Yoga and quickly developed a consistent practice that ultimately changed her
    life for the better.

    Madison offers classes rooted in breathwork, alignment, strength, and
    creativity. She guides students in releasing stagnant energy, gaining mental
    clarity, building confidence from within, and reconnecting to the wisdom and
    power that already live inside them.

    Outside of yoga, Madison enjoys creating art, traveling, and spending time
    with her close-knit family.
- name: Caity Leitz
  image: ../uploads/img-1387.jpg
  certification: Comprehensive Pilates Instructor, NASM Personal Trainer
  instagram: pilateswithcaity
  bio: >-
    Recently moving from the Washington, D.C. area to Cave City, Caity is
    already busy putting down roots in our gorgeous little corner of Kentucky.
    She comes to us with years of experience teaching at various studios and
    fitness clubs, working with everyone from total beginners to seasoned
    athletes. Whether you’re recovering from an injury, stepping onto the mat
    for the first time, or just looking to find your strength, Caity is
    passionate about helping you find movement that feels good and works for
    your body.


    Before diving full-time into fitness, Caity was a high school science
    teacher! With a background in biology, earth science, and geology, she has a
    unique understanding of how the body moves, though her classes remain
    incredibly approachable, encouraging, and focused on your personal success.


    When she isn’t on the mat, Caity loves painting, gardening, and anything
    geology-related, which makes living in the Mammoth Cave area a total dream
    come true for her. She is so happy to become a part of our community, and we
    know you’re going to love her energy!
